        summary: Multimodal Olfactory Sensing and Computing
        highlights:
          - Led a cotton-smoldering early-warning study combining field investigations, AHP-based risk modeling, and TG-FTIR-GC-MS characterization to guide multimodal sensor and experimental-system design.
          - Optimized thin-film sensing layers and electrode/substrate architectures using spin coating, layer-by-layer assembly, and ultrasonic spray coating.
          - Improved room-temperature NH3 sensing to reproducible cycles at 10-25 ppm and achieved measurable responses to H2S and CH3SH.
          - Co-developed E-Nose Station for response-curve visualization, cross-experiment comparison, odor-fingerprint analysis, model-assisted screening, and semi-automated acquisition workflows.

