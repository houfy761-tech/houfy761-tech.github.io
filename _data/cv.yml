      - company: The Future Lab, Tsinghua University
        position: Research Assistant
        location: Beijing, China
        start_date: 2026-01
        end_date: Present
        summary: Multimodal Olfactory Sensing and Computing
        highlights:
          - Led a cotton-smoldering early-warning study combining field investigations, AHP-based risk modeling, and TG-FTIR-GC-MS characterization to guide multimodal sensor and experimental-system design.
          - Optimized thin-film sensing layers and electrode/substrate architectures using spin coating, layer-by-layer assembly, and ultrasonic spray coating.
          - Improved room-temperature NH3 sensing to reproducible cycles at 10-25 ppm and achieved measurable responses to H2S and CH3SH.
          - Co-developed E-Nose Station for response-curve visualization, cross-experiment comparison, odor-fingerprint analysis, model-assisted screening, and semi-automated acquisition workflows.

      - company: Great Bay University
        position: Research Assistant
        location: Dongguan, China
        start_date: 2025-09
        end_date: 2025-12
        summary: Biomimetic Colored Radiative-Cooling Films
        highlights:
          - Fabricated and characterized microstructured colored radiative-cooling films using vacuum deposition, UV-Vis spectroscopy, infrared and thermal imaging, nanoindentation, and microscopy.
          - Processed spectral and imaging data to analyze relationships among microstructure, visible appearance, optical transparency, and thermal behavior.

      - company: Institute of Physics, Chinese Academy of Sciences
        position: Research Assistant
        location: Beijing, China
        start_date: 2024-09
        end_date: 2024-12
        summary: GSDM Protein Dynamics and Cell Pyroptosis
        highlights:
          - Used HS-AFM to visualize pore-forming dynamics of ThGSDM, GSDMD, and GSDME on bare mica and DOPC/DOPS supported lipid bilayers.
          - Contributed to X-ray crystallography data processing.

      - company: National Undergraduate Innovation and Entrepreneurship Training Program
        position: Undergraduate Researcher
        location: Lanzhou, China
        start_date: 2022-03
        end_date: 2023-03
        summary: Flexible-Substrate Metasurface Optical Tweezers
        highlights:
          - Designed PDMS flexible-substrate metasurface lenses and nanopillar unit cells using FDTD simulations and MATLAB optical-force modeling.
          - Modeled substrate deformation and demonstrated stable simulated trapping of 15 nm polystyrene spheres near the self-focusing region.

    Projects:
      - name: "Locus: Human-AI Decision Support for PhD Research Fit and Advisor Discovery"
        position: Independent Project
        location: Beijing, China
        start_date: 2026-04
        end_date: Present
        url: https://github.com/houfy761-tech/locus
        highlights:
          - Designed and developed a human-AI decision-support platform for personalized PhD research positioning and advisor exploration.
          - Built an adaptive advisor search and ranking engine using offline faculty retrieval, LLM-generated candidates, research-similarity scoring, and institution and discipline constraints.
          - Added uncertainty-aware verification using web, OpenAlex, and ORCID evidence and piloted the platform with more than 50 users.

