          - Processed spectral and imaging data to analyze relationships among microstructure, visible appearance, optical transparency, and thermal behavior.

      - company: Institute of Physics, Chinese Academy of Sciences
        position: Research Assistant
        start_date: 2024-09
        end_date: 2024-12
